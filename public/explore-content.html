<!--Explore content-->

<div id="explore-modal" class="dynamic-modal">
    
    <button class="dynamic-close" onclick="closeContent()" aria-label="Close Content">X</button>

    <div class="dynamic-inner">
        <h1 class="dynamic-title">EXPLORE SEB PRIME 100</h1>
        <p class="dynamic-subtitle">147th Moon of Saturn - Flora Catalogue</p>

        <!--Navigation-->
        <div id="explore-tabs">
            <button class="tab-btn tab-active" onclick="switchTab('inferno')">INFERNO CORE</button>
            <button class="tab-btn" onclick="switchTab('abyss')">AZURE ABYSS</button>
        </div>

        <!--INFERENO TAB-->
        <div id="tab-inferno" class="tab-content">
            <div class="flora-grid" id="flora-grid-inferno">
                 <!--Loading indicator-->
                 <p class="flora-loading">Loading flora from database...</p>   
            </div>
        </div>

        <!--ABYSS TAB-->
        <div id="tab-abyss" class="tab-content" style="display:none;">
            
            <div class="flora-grid" id="flora-grid-abyss">
                <!--Loading indicator-->
                <p class="flora-loading">Loading flora from database..</p>
            </div>  
        </div>
    </div>
</div>
